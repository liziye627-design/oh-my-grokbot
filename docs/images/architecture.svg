<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-label="Architecture (schematic)">
<title>Architecture (schematic)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6779"/></marker></defs>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Serif CJK SC',sans-serif;fill:#16202e}.m{fill:#5b6779}.b{font-weight:700}</style>
<rect width="1200" height="452" rx="16" fill="#f6f8fc"/>
<text x="32" y="44" font-size="22" class="b">架构（示意）</text><text x="32" y="70" font-size="14" class="m">两层：第一层安装能力，第二层承接任务与验收；原生 Bot 的执行在 Grok Bot 里完成</text><rect x="32" y="100" width="190" height="110" rx="12" fill="#fff" stroke="#16202e" stroke-width="1.5"/><text x="127.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#16202e">操作者</text><text x="127.0" y="150" text-anchor="middle" font-size="14">选择团队包</text><text x="127.0" y="171" text-anchor="middle" font-size="14">批准外发 / 发布</text><text x="127.0" y="192" text-anchor="middle" font-size="14">独立验收</text><rect x="262" y="92" width="400" height="300" rx="14" fill="#eaf1ff" stroke="#2563eb" stroke-dasharray="6 5"/><text x="282" y="120" font-size="16" class="b" style="fill:#2563eb">第一层 · Core Installer（ohmy CLI）</text><rect x="282" y="136" width="170" height="96" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="367.0" y="162" text-anchor="middle" font-size="14" class="b" style="fill:#2563eb">静态注册表</text><text x="367.0" y="185" text-anchor="middle" font-size="13">registry/catalog.json</text><text x="367.0" y="205" text-anchor="middle" font-size="13">版本解析 · 许可检查</text><rect x="472" y="136" width="170" height="96" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="557.0" y="162" text-anchor="middle" font-size="14" class="b" style="fill:#2563eb">可审计安装</text><text x="557.0" y="185" text-anchor="middle" font-size="13">plan → apply</text><text x="557.0" y="205" text-anchor="middle" font-size="13">verify · rollback</text><rect x="282" y="250" width="170" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="367.0" y="276" text-anchor="middle" font-size="14" class="b" style="fill:#2563eb">技能</text><text x="367.0" y="299" text-anchor="middle" font-size="13">skills/  12 Core</text><text x="367.0" y="319" text-anchor="middle" font-size="13">team-skills/ 38+4</text><text x="367.0" y="339" text-anchor="middle" font-size="13">各带 LICENSE</text><rect x="472" y="250" width="170" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="557.0" y="276" text-anchor="middle" font-size="14" class="b" style="fill:#2563eb">团队包</text><text x="557.0" y="299" text-anchor="middle" font-size="13">industries/  16 套</text><text x="557.0" y="319" text-anchor="middle" font-size="13">岗位 prompts</text><text x="557.0" y="339" text-anchor="middle" font-size="13">工作流 + 验收</text><rect x="702" y="92" width="466" height="146" rx="14" fill="#e8f6ee" stroke="#15803d" stroke-dasharray="6 5"/><text x="722" y="120" font-size="16" class="b" style="fill:#15803d">Grok Bot 原生团队（每组 2–6 个 Bot）</text><rect x="722" y="136" width="136" height="84" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="790.0" y="162" text-anchor="middle" font-size="14" class="b" style="fill:#15803d">协调员</text><text x="790.0" y="185" text-anchor="middle" font-size="13">分派 · 交接</text><rect x="872" y="136" width="136" height="84" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="940.0" y="162" text-anchor="middle" font-size="14" class="b" style="fill:#15803d">岗位 Bot</text><text x="940.0" y="185" text-anchor="middle" font-size="13">只写自己的产物</text><rect x="1022" y="136" width="136" height="84" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="1090.0" y="162" text-anchor="middle" font-size="14" class="b" style="fill:#15803d">审稿 / QA</text><text x="1090.0" y="185" text-anchor="middle" font-size="13">独立通过或退回</text><rect x="702" y="258" width="466" height="134" rx="14" fill="#f1ebff" stroke="#6d28d9" stroke-dasharray="6 5"/><text x="722" y="286" font-size="16" class="b" style="fill:#6d28d9">第二层 · 本地 Gateway（Alpha 2）</text><rect x="722" y="300" width="136" height="78" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="790.0" y="326" text-anchor="middle" font-size="14" class="b" style="fill:#6d28d9">SQLite 账本</text><text x="790.0" y="349" text-anchor="middle" font-size="13">任务 · 运行</text><rect x="872" y="300" width="136" height="78" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="940.0" y="326" text-anchor="middle" font-size="14" class="b" style="fill:#6d28d9">Result MCP</text><text x="940.0" y="349" text-anchor="middle" font-size="13">提交产物</text><rect x="1022" y="300" width="136" height="78" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="1090.0" y="326" text-anchor="middle" font-size="14" class="b" style="fill:#6d28d9">审批 · Outbox</text><text x="1090.0" y="349" text-anchor="middle" font-size="13">verifier 验收</text><line x1="222" y1="150" x2="280" y2="150" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><text x="251.0" y="143.0" text-anchor="middle" font-size="12" class="m">install</text><line x1="662" y1="210" x2="700" y2="180" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><text x="681.0" y="188.0" text-anchor="middle" font-size="12" class="m">上传包</text><line x1="935" y1="238" x2="935" y2="256" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><text x="32" y="430" font-size="13" class="m">注：原生 Bot 自动触发、飞书真实账号和原生 MCP 绑定仍待验收；当前由操作者人工派发给原生 Bot。</text>
</svg>
