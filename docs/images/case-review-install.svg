<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Review-then-install workflow (schematic)">
<title>Review-then-install workflow (schematic)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6779"/></marker></defs>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Serif CJK SC',sans-serif;fill:#16202e}.m{fill:#5b6779}.b{font-weight:700}</style>
<rect width="1200" height="370" rx="16" fill="#f6f8fc"/>
<text x="32" y="44" font-size="22" class="b">先复核、再安装：技能入库与 CI（示意）</text><text x="32" y="70" font-size="14" class="m">依据 team-skills/_catalog/skills-review.md 与 .github/workflows/ 的实际流程</text><rect x="32" y="100" width="190" height="110" rx="12" fill="#fff" stroke="#16202e" stroke-width="1.5"/><text x="127.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#16202e">候选</text><text x="127.0" y="150" text-anchor="middle" font-size="14">上游仓库候选</text><text x="127.0" y="171" text-anchor="middle" font-size="14">记录来源与许可证</text><rect x="262" y="100" width="210" height="110" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="367.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#15803d">evidence-reviewer</text><text x="367.0" y="150" text-anchor="middle" font-size="14">逐个读文件与脚本</text><text x="367.0" y="171" text-anchor="middle" font-size="14">核对 LICENSE / Source</text><rect x="262" y="250" width="210" height="96" rx="12" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="367.0" y="276" text-anchor="middle" font-size="15" class="b" style="fill:#b91c1c">退回</text><text x="367.0" y="300" text-anchor="middle" font-size="14">缺 LICENSE 或 Source</text><text x="367.0" y="321" text-anchor="middle" font-size="14">补齐后再复核</text><rect x="512" y="100" width="200" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="612.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#2563eb">安装</text><text x="612.0" y="150" text-anchor="middle" font-size="14">team-skills/ 入库</text><text x="612.0" y="171" text-anchor="middle" font-size="14">mapping.md 定岗位</text><rect x="752" y="100" width="190" height="110" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="847.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#6d28d9">PR → CI 矩阵</text><text x="847.0" y="150" text-anchor="middle" font-size="14">ubuntu-latest</text><text x="847.0" y="171" text-anchor="middle" font-size="14">windows-latest</text><rect x="982" y="100" width="186" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="1075.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#b45309">转绿后合并</text><text x="1075.0" y="150" text-anchor="middle" font-size="14">typecheck · check</text><text x="1075.0" y="171" text-anchor="middle" font-size="14">test · audit</text><line x1="222" y1="155" x2="260" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><line x1="472" y1="155" x2="510" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><text x="491.0" y="148.0" text-anchor="middle" font-size="12" class="m">通过</text><line x1="367" y1="210" x2="367" y2="248" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><path d="M262 300 C 200 300, 200 200, 240 180" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="712" y1="155" x2="750" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><line x1="942" y1="155" x2="980" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><text x="512" y="262" font-size="13" class="m">有条件通过：需要用户同意才运行的脚本（如 dev-mcp-builder 的评测脚本）只收录、不运行。</text><text x="512" y="286" font-size="13" class="m">未获用户确认的两个逆向技能留在暂存区，未进入共享技能库。</text>
</svg>
