<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="core-team workflow (schematic)">
<title>core-team workflow (schematic)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6779"/></marker></defs>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Serif CJK SC',sans-serif;fill:#16202e}.m{fill:#5b6779}.b{font-weight:700}</style>
<rect width="1200" height="380" rx="16" fill="#f6f8fc"/>
<text x="32" y="44" font-size="22" class="b">core-team：计划 → 执行 → 独立取证 → 入库（示意）</text><text x="32" y="70" font-size="14" class="m">操作者只和幕僚长对话；全文留在记录里，短摘要交回幕僚长</text><rect x="32" y="100" width="196" height="120" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="130.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#2563eb">chief-of-staff</text><text x="130.0" y="150" text-anchor="middle" font-size="14">拆目标</text><text x="130.0" y="171" text-anchor="middle" font-size="14">只上交需决定的事</text><text x="130" y="246" text-anchor="middle" font-size="12" class="m">goal-decomposition-</text><text x="130" y="262" text-anchor="middle" font-size="12" class="m">and-escalation</text><line x1="230" y1="160" x2="260" y2="160" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="262" y="100" width="196" height="120" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="360.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#6d28d9">task-planner</text><text x="360.0" y="150" text-anchor="middle" font-size="14">写步骤：岗位/输入</text><text x="360.0" y="171" text-anchor="middle" font-size="14">产物/验收条件</text><text x="360" y="246" text-anchor="middle" font-size="12" class="m">task-plan-with-</text><text x="360" y="262" text-anchor="middle" font-size="12" class="m">acceptance</text><line x1="460" y1="160" x2="490" y2="160" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="492" y="100" width="196" height="120" rx="12" fill="#fff" stroke="#16202e" stroke-width="1.5"/><text x="590.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#16202e">执行岗位</text><text x="590.0" y="150" text-anchor="middle" font-size="14">各团队 Bot</text><text x="590.0" y="171" text-anchor="middle" font-size="14">按步骤交产物</text><text x="590" y="246" text-anchor="middle" font-size="12" class="m">（各团队技能）</text><text x="590" y="262" text-anchor="middle" font-size="12" class="m"></text><line x1="690" y1="160" x2="720" y2="160" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="722" y="100" width="196" height="120" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="820.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#15803d">evidence-reviewer</text><text x="820.0" y="150" text-anchor="middle" font-size="14">独立取证</text><text x="820.0" y="171" text-anchor="middle" font-size="14">通过 / 退回 / 缺口</text><text x="820" y="246" text-anchor="middle" font-size="12" class="m">acceptance-</text><text x="820" y="262" text-anchor="middle" font-size="12" class="m">evidence-review</text><line x1="920" y1="160" x2="950" y2="160" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="952" y="100" width="196" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="1050.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#b45309">knowledge-keeper</text><text x="1050.0" y="150" text-anchor="middle" font-size="14">已验收材料入库</text><text x="1050.0" y="171" text-anchor="middle" font-size="14">短摘要回交</text><text x="1050" y="246" text-anchor="middle" font-size="12" class="m">knowledge-base-</text><text x="1050" y="262" text-anchor="middle" font-size="12" class="m">ingest</text><path d="M760 222 C 740 300, 670 300, 650 224" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="705" y="312" text-anchor="middle" font-size="13" style="fill:#b91c1c">退回：证据不足 / 不满足验收条件</text><text x="32" y="356" font-size="13" class="m">对外发送、发布、付款、删除和生产变更：列在章程末尾，仍需人工批准。</text>
</svg>
