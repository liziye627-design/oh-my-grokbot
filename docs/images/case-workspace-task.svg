<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-label="Workspace task flow (schematic)">
<title>Workspace task flow (schematic)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6779"/></marker></defs>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Serif CJK SC',sans-serif;fill:#16202e}.m{fill:#5b6779}.b{font-weight:700}</style>
<rect width="1200" height="276" rx="16" fill="#f6f8fc"/>
<text x="32" y="44" font-size="22" class="b">工作组任务：从样例输入到独立验收（示意）</text><text x="32" y="70" font-size="14" class="m">examples/workspaces/*-task.json 只给出输入键；值必须换成真实授权材料</text><rect x="32" y="100" width="196" height="110" rx="12" fill="#fff" stroke="#16202e" stroke-width="1.5"/><text x="130.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#16202e">1 任务样例</text><text x="130.0" y="150" text-anchor="middle" font-size="14">*-task.json</text><text x="130.0" y="171" text-anchor="middle" font-size="14">eventId + inputs</text><line x1="230" y1="155" x2="260" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="262" y="100" width="196" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="360.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#2563eb">2 初始化包</text><text x="360.0" y="150" text-anchor="middle" font-size="14">workspace bundle</text><text x="360.0" y="171" text-anchor="middle" font-size="14">→ generated/*.md</text><line x1="460" y1="155" x2="490" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="492" y="100" width="196" height="110" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><text x="590.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#6d28d9">3 Gateway 任务</text><text x="590.0" y="150" text-anchor="middle" font-size="14">POST …/workflows/</text><text x="590.0" y="171" text-anchor="middle" font-size="14">:workflow/tasks</text><line x1="690" y1="155" x2="720" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="722" y="100" width="196" height="110" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="820.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#15803d">4 执行 Bot</text><text x="820.0" y="150" text-anchor="middle" font-size="14">runner 凭证</text><text x="820.0" y="171" text-anchor="middle" font-size="14">Result MCP 提交</text><line x1="920" y1="155" x2="950" y2="155" stroke="#5b6779" stroke-width="1.8" marker-end="url(#a)"/><rect x="952" y="100" width="196" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="1050.0" y="126" text-anchor="middle" font-size="15" class="b" style="fill:#b45309">5 独立验收</text><text x="1050.0" y="150" text-anchor="middle" font-size="14">operator / verifier</text><text x="1050.0" y="171" text-anchor="middle" font-size="14">runner 不能自验</text><text x="32" y="250" font-size="13" class="m">5 个样例：app-studio · business-operations · content-studio · video-studio · x-growth。重复提交相同 eventId 与内容会复用任务。</text>
</svg>
